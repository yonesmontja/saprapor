    function prosesHeuristikLokal(record, teks, fileInput) {
      let t = teks.toLowerCase();
      let pS = 0, pT = 0, pN = 0, pK = 0, pM = 0;
      for (const [key, score] of Object.entries(HEURISTIK_DICT)) {
        if (t.includes(key)) { pS += score.S; pT += score.T; pN += score.N; pK += score.K; pM += score.M; }
      }
      record.val_S = pS; record.val_T = pT; record.val_N = pN; record.val_K = pK; record.val_M = pM;
      prosesUploadDanSimpan(record, fileInput);
    }

    function prosesUploadDanSimpan(record, fileInput) {
      if (fileInput) {
        showL("Mengunggah Lampiran...");
        let reader = new FileReader();
        reader.onload = function(e) {
          let content = e.target.result;
          let base64 = content.split(',')[1]; 
          google.script.run
            .withSuccessHandler(function(res) {
              if (res.success) { 
                record.lampiran_url = res.url; 
                simpanKeDatabase(record); 
              } else { 
                hideL(); popAlert('error', 'Gagal Unggah: ' + res.message); 
              }
            })
            .withFailureHandler(function(err) { hideL(); popAlert('error', 'Koneksi Putus Saat Upload'); })
            .uploadFileToDrive(base64, fileInput.name, fileInput.type);
        };
        reader.readAsDataURL(fileInput);
      } else {
        simpanKeDatabase(record);
      }
    }

    function simpanKeDatabase(record) {
      showL(editJurnalId ? "Memperbarui Jurnal..." : "Menyimpan Jurnal...");
      if (editJurnalId) record.id_jurnal = editJurnalId; 

      let targetSiswaKelas = document.getElementById('j_kelas').value;

      let runner = google.script.run
        .withSuccessHandler(function(r) {
          if (r.success) {
            document.getElementById('formJurnal').reset();
            let localDate = new Date();
            localDate.setMinutes(localDate.getMinutes() - localDate.getTimezoneOffset());
            document.getElementById('j_tanggal').value = localDate.toISOString().slice(0, 10);
            
            let isEditMode = editJurnalId !== null;
            editJurnalId = null; 
            
            let btnSubmit = document.querySelector('#formJurnal button[type="submit"]');
            if(btnSubmit) {
               btnSubmit.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> Posting Jurnal';
               btnSubmit.classList.remove('btn-warning');
               btnSubmit.classList.add('btn-primary');
            }

            popAlert('success', isEditMode ? 'Jurnal berhasil diperbarui!' : 'Jurnal berhasil diposting!');

            let feedDropdown = document.getElementById('f_kelas');
            if(feedDropdown) feedDropdown.value = targetSiswaKelas;
            
            fetchFeedData(); 

          } else {
            hideL(); popAlert('error', r.message);
          }
        })
        .withFailureHandler(function(err) { hideL(); popAlert('error', 'Error Menyimpan: ' + err.message); });

      if (editJurnalId) runner.updateJurnalAnekdotal(record);
      else runner.saveJurnalAnekdotal(record);
    }

    function renderFeed() {
      let container = document.getElementById('feedContainer');
      let idKlsFilter = document.getElementById('f_kelas').value;

      if (!idKlsFilter) {
         container.innerHTML = '<div class="text-center py-5 text-muted"><i class="fa-solid fa-mug-hot fa-3x mb-3 opacity-25"></i><h5>Pilih Kelas untuk merender riwayat jurnal.</h5></div>';
         return;
      }

      if (!DB.TransJurnal || DB.TransJurnal.length === 0) {
        container.innerHTML = '<div class="text-center py-5 text-muted"><i class="fa-solid fa-mug-hot fa-3x mb-3 opacity-25"></i><h5>Belum ada jurnal observasi untuk kelas ini.</h5></div>';
        return;
      }

      let jurnals = DB.TransJurnal.slice().sort((a,b) => new Date(b.tanggal||0) - new Date(a.tanggal||0)); 
      let html = "";
      let hasData = false;

      jurnals.forEach(function(j) {
        let siswa = DB.MasterSiswa?.find(s => String(s.id_siswa) === String(j.id_siswa));
        if (!siswa) return;
        
        hasData = true;
        let kelasObj = DB.MasterKelas?.find(k => String(k.id_kelas) === String(siswa.id_kelas));
        let kelasStr = kelasObj ? kelasObj.nama_kelas : "-";
        
        let inisial = (siswa.nama_siswa || "S").charAt(0).toUpperCase();
        let dDate = new Date(j.tanggal);
        let tgl = isNaN(dDate) ? (j.tanggal || "-") : dDate.toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'});
        
        let namaAktivitas = "";
        if (j.id_materi && String(j.id_materi).trim() !== "") {
           let matObj = DB.MasterMateri?.find(m => String(m.id_materi) === String(j.id_materi));
           if(matObj) namaAktivitas = `<span class="badge bg-primary ms-2"><i class="fa-solid fa-book"></i> ${matObj.nama_materi}</span>`;
        } else if (j.id_jenis && String(j.id_jenis).trim() !== "") {
           let mbkObj = DB.MasterMBK?.find(m => String(m.id_jenis) === String(j.id_jenis));
           if(mbkObj) namaAktivitas = `<span class="badge bg-success ms-2"><i class="fa-solid fa-person-running"></i> ${mbkObj.kategori_penilaian}</span>`;
        }

        let badgeDampak = (j.mode_dampak === 'BONUS') 
          ? '<span class="badge bg-danger ms-2"><i class="fa-solid fa-bolt"></i> Intervensi</span>' 
          : '<span class="badge bg-secondary ms-2"><i class="fa-solid fa-eye"></i> Catatan</span>';
          
        let lampiranHtml = "";
        if (j.lampiran_url && j.lampiran_url.length > 5) {
          let imgSrc = j.lampiran_url;
          if (imgSrc.includes('drive.google.com/file/d/')) {
            let fileId = imgSrc.split('/d/')[1].split('/')[0];
            imgSrc = 'https://drive.google.com/uc?export=view&id=' + fileId;
          }
          lampiranHtml = `<div class="mt-3"><a href="${j.lampiran_url}" target="_blank"><img src="${imgSrc}" class="feed-img-attachment border shadow-sm" alt="Lampiran" onerror="this.style.display='none';"></a></div>`;
        }

        let formatPoin = function(val) {
          let v = parseFloat(val); if (isNaN(v)) v = 0;
          if (v > 0) return `<span class="badge badge-stnkm bg-success">+${v}</span>`;
          if (v < 0) return `<span class="badge badge-stnkm bg-danger">${v}</span>`;
          return `<span class="badge badge-stnkm bg-light text-muted border">0</span>`;
        };

        let narasiBersih = (j.narasi_kejadian || "").toString().replace(/\n/g, '<br>');

        html += `<div class="card feed-card p-4">
            <div class="feed-header">
              <div class="feed-avatar shadow-sm">${inisial}</div>
              <div class="feed-meta w-100 d-flex justify-content-between align-items-start">
                <div>
                  <h6><a href="#" onclick="window.top.location.href = SCRIPT_URL + '?page=profil&tipe=siswa&id=${j.id_siswa}'" class="text-decoration-none text-dark">${siswa.nama_siswa}</a> ${badgeDampak} ${namaAktivitas}</h6>
                  <small>${kelasStr} &bull; ${tgl}</small>
                </div>
                <div class="btn-group">
                  <button class="btn btn-sm text-primary shadow-none" onclick="editJurnal('${j.id_jurnal}')" title="Edit"><i class="fa-solid fa-pen"></i></button>
                  <button class="btn btn-sm text-muted shadow-none" onclick="delJurnal('${j.id_jurnal}', '${(j.lampiran_url || '')}')" title="Hapus"><i class="fa-solid fa-trash-can hover-danger"></i></button>
                </div>
              </div>
            </div>
            <div class="feed-body">${narasiBersih} ${lampiranHtml}</div>
            <div class="feed-footer">
              <div class="d-flex align-items-center">
                <span class="small fw-bold text-muted me-2"><i class="fa-solid fa-microchip me-1"></i>NLP:</span>
                ${formatPoin(j.val_S)} <span class="small fw-bold me-2">S</span>
                ${formatPoin(j.val_T)} <span class="small fw-bold me-2">T</span>
                ${formatPoin(j.val_N)} <span class="small fw-bold me-2">N</span>
                ${formatPoin(j.val_K)} <span class="small fw-bold me-2">K</span>
                ${formatPoin(j.val_M)} <span class="small fw-bold">M</span>
              </div>
            </div>
          </div>`;
      });

      if (!hasData) container.innerHTML = '<div class="text-center py-5 text-muted"><h5>Belum ada jurnal observasi untuk kelas ini.</h5></div>';
      else container.innerHTML = html;
    }

    function handleJurnalSearch(val) { searchJurnalQuery = val.toLowerCase(); currentJurnalPage = 1; renderJurnalTable(); }
    function sortJurnalTable(col) {
      if (sortJurnalCol === col) sortJurnalAsc = !sortJurnalAsc;
      else { sortJurnalCol = col; sortJurnalAsc = true; }
      renderJurnalTable();
    }
    function changeJurnalPage(dir) { currentJurnalPage += dir; renderJurnalTable(); }

    function renderJurnalTable() {
      let idKlsFlt = document.getElementById('f_kelas').value;
      let tbody = document.getElementById('jurnalTableBody');
      let thead = document.getElementById('jurnalThead');

      let cols = [
        { id: 'tanggal', label: 'Tanggal' },
        { id: 'siswa', label: 'Nama Siswa' },
        { id: 'aktivitas', label: 'Aktivitas / Materi' },
        { id: 'kejadian', label: 'Kejadian / Perilaku' },
        { id: 'dampak', label: 'Mode' },
        { id: 'poin', label: 'STNKM' },
        { id: 'aksi', label: 'Aksi' } 
      ];

      let thHtml = "<tr>";
      cols.forEach(c => {
        let icon = "fa-sort text-muted opacity-50";
        if (sortJurnalCol === c.id) icon = sortJurnalAsc ? "fa-sort-up text-primary" : "fa-sort-down text-primary";
        let align = (c.id === 'siswa' || c.id === 'kejadian') ? 'text-start' : 'text-center';
        
        if (c.id === 'poin' || c.id === 'aksi') thHtml += `<th class="${align}">${c.label}</th>`; 
        else thHtml += `<th class="sortable ${align}" onclick="sortJurnalTable('${c.id}')">${c.label} <i class="fa-solid ${icon} ms-1"></i></th>`;
      });
      thHtml += "</tr>";
      thead.innerHTML = thHtml;

      if (!idKlsFlt) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Pilih Kelas untuk merender tabel.</td></tr>';
        document.getElementById('pageIndicatorJurnal').innerText = "Halaman 1";
        document.getElementById('btnPrevJurnal').disabled = true; document.getElementById('btnNextJurnal').disabled = true;
        return;
      }

      let dataJurnal = (DB.TransJurnal || []).map(row => {
        let nSis = DB.MasterSiswa?.find(s => String(s.id_siswa) === String(row.id_siswa))?.nama_siswa || row.id_siswa;
        
        let nAkt = "Umum";
        if (row.id_materi && String(row.id_materi).trim() !== "") {
           nAkt = DB.MasterMateri?.find(m => String(m.id_materi) === String(row.id_materi))?.nama_materi || row.id_materi;
        } else if (row.id_jenis && String(row.id_jenis).trim() !== "") {
           nAkt = DB.MasterMBK?.find(m => String(m.id_jenis) === String(row.id_jenis))?.kategori_penilaian || row.id_jenis;
        }

        return { ...row, nama_siswa: nSis, nama_aktivitas: nAkt };
      });

      if(searchJurnalQuery !== "") {
        dataJurnal = dataJurnal.filter(d => 
          String(d.nama_siswa).toLowerCase().includes(searchJurnalQuery) ||
          String(d.nama_aktivitas).toLowerCase().includes(searchJurnalQuery) ||
          String(d.narasi_kejadian).toLowerCase().includes(searchJurnalQuery) ||
          String(d.tanggal).toLowerCase().includes(searchJurnalQuery) ||
          String(d.mode_dampak).toLowerCase().includes(searchJurnalQuery)
        );
      }

      dataJurnal.sort((a, b) => {
        let valA, valB;
        if (sortJurnalCol === 'tanggal') { valA = new Date(a.tanggal||0); valB = new Date(b.tanggal||0); }
        else if (sortJurnalCol === 'siswa') { valA = a.nama_siswa; valB = b.nama_siswa; }
        else if (sortJurnalCol === 'aktivitas') { valA = a.nama_aktivitas; valB = b.nama_aktivitas; }
        else if (sortJurnalCol === 'kejadian') { valA = a.narasi_kejadian; valB = b.narasi_kejadian; }
        else if (sortJurnalCol === 'dampak') { valA = a.mode_dampak; valB = b.mode_dampak; }

        if (valA < valB) return sortJurnalAsc ? -1 : 1;
        if (valA > valB) return sortJurnalAsc ? 1 : -1;
        return 0;
      });

      let totalPages = Math.ceil(dataJurnal.length / rowsPerJurnalPage) || 1;
      if (currentJurnalPage > totalPages) currentJurnalPage = totalPages;
      if (currentJurnalPage < 1) currentJurnalPage = 1;

      let start = (currentJurnalPage - 1) * rowsPerJurnalPage;
      let paginated = dataJurnal.slice(start, start + rowsPerJurnalPage);

      let htmlRows = "";
      paginated.forEach(row => {
        let badgeDampak = (row.mode_dampak === 'BONUS') ? '<span class="badge bg-danger">Intervensi</span>' : '<span class="badge bg-secondary">Catatan</span>';
        
        let sS = parseFloat(row.val_S)||0, sT = parseFloat(row.val_T)||0, sN = parseFloat(row.val_N)||0, sK = parseFloat(row.val_K)||0, sM = parseFloat(row.val_M)||0;
        let bS = sS===0 ? 'bg-light text-muted' : (sS>0 ? 'bg-success':'bg-danger');
        let bT = sT===0 ? 'bg-light text-muted' : (sT>0 ? 'bg-success':'bg-danger');
        let bN = sN===0 ? 'bg-light text-muted' : (sN>0 ? 'bg-success':'bg-danger');
        let bK = sK===0 ? 'bg-light text-muted' : (sK>0 ? 'bg-success':'bg-danger');
        let bM = sM===0 ? 'bg-light text-muted' : (sM>0 ? 'bg-success':'bg-danger');

        let stnkmHtml = `
          <div class="d-flex justify-content-center gap-1">
            <span class="badge ${bS}" title="Skill">${sS} S</span>
            <span class="badge ${bT}" title="Teori">${sT} T</span>
            <span class="badge ${bN}" title="Nalar">${sN} N</span>
            <span class="badge ${bK}" title="Karakter">${sK} K</span>
            <span class="badge ${bM}" title="Minat">${sM} M</span>
          </div>`;

        let narasiPendek = row.narasi_kejadian;
        if(narasiPendek.length > 50) narasiPendek = narasiPendek.substring(0,50) + "...";

        let actionHtml = `
          <div class="d-flex justify-content-center gap-1">
            <button class="btn btn-sm btn-warning" onclick="editJurnal('${row.id_jurnal}')" title="Edit"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-sm btn-danger" onclick="delJurnal('${row.id_jurnal}', '${(row.lampiran_url || '')}')" title="Hapus"><i class="fa-solid fa-trash-can"></i></button>
          </div>`;

        htmlRows += `<tr>
          <td class="text-center align-middle">${row.tanggal}</td>
          <td class="fw-bold text-start text-primary align-middle">${row.nama_siswa}</td>
          <td class="text-center align-middle"><small class="text-muted fw-bold">${row.nama_aktivitas}</small></td>
          <td class="text-start fst-italic text-muted align-middle" title="${row.narasi_kejadian}">${narasiPendek}</td>
          <td class="text-center align-middle">${badgeDampak}</td>
          <td class="text-center align-middle">${stnkmHtml}</td>
          <td class="text-center align-middle">${actionHtml}</td>
        </tr>`;
      });

      if (paginated.length === 0) htmlRows = `<tr><td colspan="7" class="text-muted py-4">Data tidak ditemukan.</td></tr>`;

      tbody.innerHTML = htmlRows;
      document.getElementById('pageIndicatorJurnal').innerText = `Halaman ${currentJurnalPage} dari ${totalPages}`;
      document.getElementById('btnPrevJurnal').disabled = (currentJurnalPage === 1);
      document.getElementById('btnNextJurnal').disabled = (currentJurnalPage === totalPages);
    }

    function exportJurnalData(format) {
      showL("Mempersiapkan Dokumen Ekspor...");
      let idKls = document.getElementById('f_kelas').value;
      if (!idKls) { hideL(); return Swal.fire('Perhatian', 'Pilih Kelas terlebih dahulu.', 'warning'); }

      let dataRaw = (DB.TransJurnal || []);
      if(dataRaw.length === 0) { hideL(); return Swal.fire('Kosong', 'Tidak ada data untuk diekspor.', 'info'); }

      let dataToExport = dataRaw.map(row => {
        let nSis = DB.MasterSiswa?.find(s => String(s.id_siswa) === String(row.id_siswa))?.nama_siswa || row.id_siswa;
        
        let nAkt = "Umum";
        if (row.id_materi && String(row.id_materi).trim() !== "") {
           nAkt = DB.MasterMateri?.find(m => String(m.id_materi) === String(row.id_materi))?.nama_materi || row.id_materi;
        } else if (row.id_jenis && String(row.id_jenis).trim() !== "") {
           nAkt = DB.MasterMBK?.find(m => String(m.id_jenis) === String(row.id_jenis))?.kategori_penilaian || row.id_jenis;
        }

        return { ...row, nama_siswa: nSis, nama_aktivitas: nAkt };
      });

      if(searchJurnalQuery !== "") {
         dataToExport = dataToExport.filter(d => 
            String(d.nama_siswa).toLowerCase().includes(searchJurnalQuery) ||
            String(d.nama_aktivitas).toLowerCase().includes(searchJurnalQuery) ||
            String(d.narasi_kejadian).toLowerCase().includes(searchJurnalQuery) ||
            String(d.tanggal).toLowerCase().includes(searchJurnalQuery) ||
            String(d.mode_dampak).toLowerCase().includes(searchJurnalQuery)
         );
      }

      dataToExport.sort((a, b) => {
        let valA, valB;
        if (sortJurnalCol === 'tanggal') { valA = new Date(a.tanggal||0); valB = new Date(b.tanggal||0); }
        else if (sortJurnalCol === 'siswa') { valA = a.nama_siswa; valB = b.nama_siswa; }
        else if (sortJurnalCol === 'aktivitas') { valA = a.nama_aktivitas; valB = b.nama_aktivitas; }
        else if (sortJurnalCol === 'kejadian') { valA = a.narasi_kejadian; valB = b.narasi_kejadian; }
        else if (sortJurnalCol === 'dampak') { valA = a.mode_dampak; valB = b.mode_dampak; }
        if (valA < valB) return sortJurnalAsc ? -1 : 1;
        if (valA > valB) return sortJurnalAsc ? 1 : -1;
        return 0;
      });

      let sek = (DB.PengaturanSekolah && DB.PengaturanSekolah.length > 0) ? DB.PengaturanSekolah[0] : { nama_sekolah: 'Sekolah', alamat_sekolah: '-', kota: '-', nama_kepsek: 'Kepala Sekolah', nip_kepsek: '-' };
      let kelasObj = DB.MasterKelas?.find(k => String(k.id_kelas) === String(idKls));
      let namaKelas = kelasObj ? kelasObj.nama_kelas : "Kelas";

      if(format === 'csv') {
        hideL();
        let csvContent = "data:text/csv;charset=utf-8,Tanggal,Nama Siswa,Aktivitas,Perilaku/Kejadian,Mode,Poin STNKM\n";
        dataToExport.forEach(r => { 
           let pt = `S:${r.val_S||0} T:${r.val_T||0} N:${r.val_N||0} K:${r.val_K||0} M:${r.val_M||0}`;
           let nrs = String(r.narasi_kejadian||'').replace(/"/g, '""').replace(/\n/g, ' ');
           csvContent += `"${r.tanggal}","${r.nama_siswa}","${r.nama_aktivitas}","${nrs}","${r.mode_dampak}","${pt}"\n`; 
        });
        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a"); link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Rekap_Jurnal_${namaKelas}_${new Date().getTime()}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      } 
      else if (format === 'pdf') {
         let printWin = window.open('', '', 'width=1024,height=768');
         let today = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
         
         let html = `<html><head><title>Laporan Jurnal Kelas</title>
           <style> 
             @page { size: landscape; margin: 15mm; }
             body { font-family: 'Times New Roman', Times, serif; color: #000; font-size: 12px; }
             table { width: 100%; border-collapse: collapse; margin-top: 15px; }
             th, td { border: 1px solid #000; padding: 6px 8px; text-align: left; vertical-align: top;}
             .header-col { background-color: #f0f0f0; text-align: center; font-weight: bold; }
             .kop-surat-container { background-color: #fff; border: none; padding: 0 0 20px 0; }
             .kop-surat { text-align: center; border-bottom: 3px solid #000; padding-bottom: 10px; }
             .kop-surat h3 { margin: 0; font-size: 20px; text-transform: uppercase; }
             .kop-surat p { margin: 5px 0 0 0; font-size: 14px; font-weight: normal; }
             .ttd-box { width: 250px; float: right; text-align: center; margin-top: 30px; font-size: 14px;}
             thead { display: table-header-group; }
             tfoot { display: table-footer-group; }
             tr { page-break-inside: avoid; }
           </style></head><body>
           
           <table>
             <thead>
               <tr>
                 <th colspan="7" class="kop-surat-container">
                   <div class="kop-surat">
                     <h3>LAPORAN JURNAL OBSERVASI KELAS</h3>
                     <p>${sek.nama_sekolah} | ${sek.alamat_sekolah}</p>
                     <p style="margin-top:5px; font-size:13px;"><strong>Kelas: ${namaKelas}</strong></p>
                   </div>
                 </th>
               </tr>
               <tr>
                 <th class="header-col" width="3%">No</th>
                 <th class="header-col" width="10%">Tanggal</th>
                 <th class="header-col" width="17%">Nama Siswa</th>
                 <th class="header-col" width="15%">Aktivitas</th>
                 <th class="header-col" width="35%">Narasi Kejadian</th>
                 <th class="header-col" width="7%">Dampak</th>
                 <th class="header-col" width="13%">Poin STNKM</th>
               </tr>
             </thead>
             <tbody>`;
             
         dataToExport.forEach((r, idx) => { 
           let pt = `S:${r.val_S||0} T:${r.val_T||0} N:${r.val_N||0} K:${r.val_K||0} M:${r.val_M||0}`;
           let nrs = String(r.narasi_kejadian||'').replace(/\n/g, '<br>');
           html += `<tr>
                     <td style="text-align:center;">${idx+1}</td>
                     <td style="text-align:center;">${r.tanggal}</td>
                     <td style="font-weight:bold;">${r.nama_siswa}</td>
                     <td style="text-align:center; font-size:11px;">${r.nama_aktivitas}</td>
                     <td style="font-style:italic;">${nrs}</td>
                     <td style="text-align:center;">${r.mode_dampak}</td>
                     <td style="text-align:center; font-size:11px;">${pt}</td>
                   </tr>`; 
         });
         
         html += `
             </tbody>
             <tfoot>
               <tr>
                 <td colspan="7" style="border: none; padding: 0;">
                   <div class="ttd-box">
                     ${sek.kota}, ${today}<br>Kepala Sekolah<br><br><br><br><br>
                     <strong>${sek.nama_kepsek}</strong><br>NIP. ${sek.nip_kepsek}
                   </div>
                 </td>
               </tr>
             </tfoot>
           </table>
           </body></html>`;
           
         hideL();
         printWin.document.write(html); 
         printWin.document.close(); 
         printWin.focus();
         setTimeout(() => { printWin.print(); printWin.close(); }, 800); 
      }
    }

    function editJurnal(id) {
      let j = DB.TransJurnal.find(function(x) { return String(x.id_jurnal) === String(id); });
      if(!j) return;
      let siswa = DB.MasterSiswa.find(function(s) { return String(s.id_siswa) === String(j.id_siswa); });
      if(siswa) {
        document.getElementById('j_kelas').value = siswa.id_kelas;
        if (j.id_materi && String(j.id_materi).trim() !== "") {
           document.getElementById('j_konteks').value = 'KBM';
        } else {
           document.getElementById('j_konteks').value = 'OBSERVASI';
        }
        let tglVal = j.tanggal || "";
        if (tglVal.includes('/')) {
          let parts = tglVal.split('/');
          if (parts.length === 3) tglVal = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
        } else if (tglVal.includes('T')) {
          tglVal = tglVal.split('T')[0];
        }
        document.getElementById('j_tanggal').value = tglVal;
        updateDropdowns(); 
        setTimeout(function() {
          document.getElementById('j_siswa').value = j.id_siswa;
          document.getElementById('j_materi').value = (j.id_materi && String(j.id_materi).trim() !== "") ? j.id_materi : j.id_jenis;
        }, 300); 
      }
      document.getElementById('j_narasi').value = j.narasi_kejadian;
      document.querySelector('input[name="impact_mode"][value="' + j.mode_dampak + '"]').checked = true;
      editJurnalId = id; 
      let btnSubmit = document.querySelector('#formJurnal button[type="submit"]');
      if(btnSubmit) {
        btnSubmit.innerHTML = '<i class="fa-solid fa-pen-to-square me-2"></i> Perbarui & Analisis Ulang';
        btnSubmit.classList.replace('btn-primary', 'btn-warning');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function delJurnal(id, lampiranUrl) {
      if (typeof Swal !== 'undefined') {
        Swal.fire({ title: 'Hapus Permanen?', text: "Jurnal dan lampiran file di Drive akan ikut terhapus.", icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Ya, Hapus' }).then(function(result) {
          if (result.isConfirmed) {
            showL("Menghapus Data...");
            google.script.run
              .withSuccessHandler(function() { fetchFeedData(); popAlert('success', 'Jurnal Dihapus'); })
              .withFailureHandler(function(err) { hideL(); popAlert('error', err.message); })
              .deleteJurnalDanLampiran(id, lampiranUrl); 
          }
        });
      }
    }
  </script>
