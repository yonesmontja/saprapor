<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EduRapor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: sans-serif; }
    #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; }
  </style>
</head>
<body>

  <div id="loadingOverlay">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
    <h5 class="mt-3 text-muted" id="loadingText">Verifikasi...</h5>
  </div>

  <div class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="card p-5 shadow" style="width: 100%; max-width: 400px;">
      <h3 class="text-center fw-bold text-primary mb-4">EduRapor v6</h3>
      <form onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="fw-bold">Login Sebagai</label>
          <select class="form-select" id="logRole">
            <option value="admin">Admin</option>
            <option value="kepsek">Kepala Sekolah</option>
            <option value="guru">Guru</option>
            <option value="siswa">Siswa</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="fw-bold">ID / Username</label>
          <input type="text" class="form-control" id="logUser" required>
        </div>
        <div class="mb-4">
          <label class="fw-bold">Password</label>
          <input type="password" class="form-control" id="logPass" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Masuk</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    // 1. Menangkap URL aplikasi dinamis dari Backend
    const SCRIPT_URL = "<?= scriptUrl ?>";

    // 2. Cek Sesi: Jika user sudah login (sesi belum dihapus browser), langsung lompat ke dashboard
    if (sessionStorage.getItem('eduUser')) {
       window.top.location.href = SCRIPT_URL + "?page=dashboard";
    }

    function showL(t="Memproses...") { 
      document.getElementById('loadingText').innerText = t; 
      document.getElementById('loadingOverlay').style.display = 'flex'; 
    }
    
    function hideL() { 
      document.getElementById('loadingOverlay').style.display = 'none'; 
    }

    // 3. Eksekusi Login
    function handleLogin(e) {
      e.preventDefault(); 
      showL("Verifikasi Data...");
      
      let u = document.getElementById('logUser').value;
      let p = document.getElementById('logPass').value;
      let r = document.getElementById('logRole').value;

      google.script.run
        .withSuccessHandler(res => {
          if(res.success) {
            // TAHAP MANAJEMEN SESI: Simpan data kredensial di penyimpanan sementara browser
            sessionStorage.setItem('eduUser', JSON.stringify(res));
            
            // REDIRECT URL: Arahkan ke halaman dasbor
            window.top.location.href = SCRIPT_URL + "?page=dashboard";
          } else { 
            hideL(); 
            Swal.fire({icon:'error', title: 'Gagal', text: res.message}); 
          }
        })
        .withFailureHandler(err => { 
          hideL(); 
          Swal.fire('Error Database', err.message, 'error'); 
        })
        .verifyUser(u, p, r);
    }
  </script>
</body>
</html>
