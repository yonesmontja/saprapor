<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Master - EduRapor API</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-database"></i> EduRapor (Headless)</a>
      <div class="d-flex text-white align-items-center">
        <span id="userNama" class="fw-bold me-3"></span>
        <button class="btn btn-sm btn-danger" onclick="logout()"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4><i class="fa-solid fa-server text-secondary"></i> Pengujian Modul Data Master</h4>
      <button class="btn btn-success fw-bold" id="btnSync" onclick="loadDataMaster()"><i class="fa-solid fa-rotate me-2"></i>Tarik Data via API</button>
    </div>

    <!-- Tampilan Uji Coba: Data Kelas -->
    <div class="card border-0 shadow-sm p-4">
      <h6 class="fw-bold text-primary mb-3">Data Kelas (Hasil Fetch)</h6>
      <div class="table-responsive">
        <table class="table table-bordered table-striped text-center align-middle">
          <thead class="table-dark">
            <tr>
              <th width="20%">ID Kelas</th>
              <th width="40%">Nama Kelas</th>
              <th width="40%">Wali Kelas</th>
            </tr>
          </thead>
          <tbody id="tabelKelasBody">
            <tr><td colspan="3" class="text-muted py-4">Klik 'Tarik Data via API' untuk memuat...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI (Harus sama dengan di login.html)
    const API_URL = "https://script.google.com/macros/s/AKfycbxJZDVn4r709RLpsd-qaGKPlWuFdY_jl_KPTTUm1LtNO8836u7-IkMvFpwdMmXEUZx_3A/exec"; 
    
    let DB = {};
    let cUser = null;

    // Cek Sesi Login Klien
    try {
      cUser = JSON.parse(sessionStorage.getItem('eduUser'));
      if (!cUser || !cUser.name) window.location.href = "login.html";
      else document.getElementById('userNama').innerText = cUser.name;
    } catch(e) {
      window.location.href = "login.html";
    }

    function logout() {
      sessionStorage.removeItem('eduUser');
      window.location.href = "login.html";
    }

    function loadDataMaster() {
      let btn = document.getElementById('btnSync');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Menarik API...';

      // FETCH (GET) KE GOOGLE APPS SCRIPT
      fetch(API_URL + "?action=getMaster", {
        method: "GET",
        redirect: "follow"
      })
      .then(response => response.json())
      .then(res => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-rotate me-2"></i>Tarik Data via API';
        
        if (res.success) {
          DB = res.data; // Semua data referensi terkumpul di sini
          renderTabelKelas();
          Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Data API Berhasil Ditarik!', showConfirmButton: false, timer: 2000 });
        } else {
          Swal.fire('Error API', 'Gagal memuat data dari server.', 'error');
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-rotate me-2"></i>Tarik Data via API';
        Swal.fire('Koneksi Gagal', 'Pastikan Web App Google telah di-Deploy dan izinkan "Anyone" access.', 'error');
      });
    }

    function renderTabelKelas() {
      let tbody = "";
      let kelasData = DB.MasterKelas || [];
      
      if(kelasData.length === 0) {
         document.getElementById('tabelKelasBody').innerHTML = '<tr><td colspan="3" class="text-muted py-4">Tabel MasterKelas kosong di database.</td></tr>';
         return;
      }

      kelasData.forEach(k => {
        tbody += `<tr>
          <td class="fw-bold">${k.id_kelas}</td>
          <td class="text-primary fw-bold">${k.nama_kelas}</td>
          <td>${k.wali_kelas || '-'}</td>
        </tr>`;
      });
      document.getElementById('tabelKelasBody').innerHTML = tbody;
    }
  </script>
</body>
</html>
