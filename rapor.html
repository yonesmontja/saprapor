<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pusat Cetak Dokumen Rapor - EduRapor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    body { background-color: #f4f6f9; font-family: sans-serif; }
    #loadingOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.95); z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    #printAreaContainer {
      margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    .preview-page {
      background: white; width: 210mm; min-height: 297mm;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); padding: 15mm;
      box-sizing: border-box; font-family: 'Times New Roman', Times, serif; color: #000;
    }
    .main-print-table { width: 100%; border-collapse: collapse; border: none; }
    .main-print-table>thead>tr>td, .main-print-table>tbody>tr>td, .main-print-table>tfoot>tr>td { border: none; padding: 0; }
    .nilai-table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 12px; }
    .nilai-table th, .nilai-table td { border: 1px solid #000; padding: 6px; text-align: left; }
    .nilai-table th { background-color: #f0f0f0; text-align: center; font-weight: bold; }
    .header-info-table { width: 100%; font-size: 13px; margin-bottom: 10px; border-bottom: 2px solid #000; padding-bottom: 5px; border-collapse: collapse; }
    .header-info-table td { border: none; padding: 2px 0; }
    .ttd-table { width: 100%; text-align: center; font-size: 13px; font-weight: normal; border: none; }
    .ttd-table td { border: none; padding: 0; }
  </style>
</head>

<body>

  <div id="loadingOverlay">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
    <h5 class="mt-3 text-muted" id="loadingText">Menyiapkan Mesin Dokumen...</h5>
  </div>

  <script> const SCRIPT_URL = "<?= scriptUrl ?>"; </script>
  <?!= include('navbar'); ?>

  <div class="container mt-4 mb-5 no-print control-area">
    <h3 class="mb-4 text-primary fw-bold"><i class="fa-solid fa-print"></i> Pusat Cetak Dokumen Rapor</h3>

    <div class="card p-4 shadow-sm border-top border-primary border-4">
      <div class="row">
        <div class="col-md-2 mb-3">
          <label class="fw-bold text-primary">Periode</label>
          <select class="form-select border-primary" id="p_periode" onchange="updateOptions()"></select>
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold text-primary">Kelas</label>
          <select class="form-select border-primary" id="p_kelas" onchange="updateOptions()"></select>
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold text-primary">Siswa</label>
          <select class="form-select border-primary" id="p_siswa" onchange="renderDokumen()">
            <option value="">- Pilih Kelas Dulu -</option>
          </select>
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold text-primary">Kalkulasi Akademik</label>
          <select class="form-select border-primary bg-light" id="p_mode_kalkulasi" onchange="toggleBobotPanel(); renderDokumen();">
            <option value="1">1. Konvensional</option>
            <option value="2" selected>2. Hibrida (STNKM)</option>
            <option value="3">3. Absolut (STNKM)</option>
          </select>
        </div>
        <div class="col-md-2 mb-3">
          <label class="fw-bold text-primary">Jenis Dokumen</label>
          <select class="form-select border-primary" id="p_mode" onchange="renderDokumen()">
            <option value="lengkap">Buku Lengkap</option>
            <option value="akademik">Akademik Saja</option>
            <option value="p5">P5 Saja</option>
          </select>
        </div>
        <div class="col-md-2 mb-3 d-flex align-items-end gap-2">
          <button class="btn btn-warning w-50 fw-bold shadow-sm text-dark" onclick="bukaPanelEvaluasi()" title="Catatan AI Wali Kelas"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
          <button class="btn btn-danger w-50 fw-bold shadow-sm" onclick="downloadFullPDF()" title="Cetak PDF Native"><i class="fa-solid fa-file-pdf"></i></button>
        </div>

        <div class="col-md-12 mb-3 d-none" id="panel_bobot_stnkm">
          <div class="alert alert-warning border-warning shadow-sm mb-0 p-3">
            <h6 class="fw-bold mb-2"><i class="fa-solid fa-sliders"></i> Pengaturan Bobot Penentu Nilai Akhir (Skala 0.0 - 1.0)</h6>
            <div class="d-flex flex-wrap gap-3">
              <div class="input-group input-group-sm" style="width: 130px;"><span class="input-group-text fw-bold text-primary">Skill</span><input type="number" class="form-control" id="bobot_S" value="1.0" min="0" max="1" step="0.1" onchange="renderDokumen()"></div>
              <div class="input-group input-group-sm" style="width: 130px;"><span class="input-group-text fw-bold text-success">Teori</span><input type="number" class="form-control" id="bobot_T" value="1.0" min="0" max="1" step="0.1" onchange="renderDokumen()"></div>
              <div class="input-group input-group-sm" style="width: 130px;"><span class="input-group-text fw-bold text-info">Nalar</span><input type="number" class="form-control" id="bobot_N" value="1.0" min="0" max="1" step="0.1" onchange="renderDokumen()"></div>
              <div class="input-group input-group-sm" style="width: 130px;"><span class="input-group-text fw-bold text-warning">Karakter</span><input type="number" class="form-control" id="bobot_K" value="1.0" min="0" max="1" step="0.1" onchange="renderDokumen()"></div>
              <div class="input-group input-group-sm" style="width: 130px;"><span class="input-group-text fw-bold text-danger">Minat</span><input type="number" class="form-control" id="bobot_M" value="1.0" min="0" max="1" step="0.1" onchange="renderDokumen()"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="printAreaContainer" class="d-none pb-5"></div>

  <!-- MODAL EVALUASI CATATAN WALI KELAS (AI) -->
  <div class="modal fade" id="modalEvaluasi" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold"><i class="fa-solid fa-robot me-2"></i> Sintesis Catatan Wali Kelas</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body bg-light">
          
          <!-- PEMBARUAN: Pilihan Model AI (Penambahan Claude) -->
          <div class="d-flex justify-content-between align-items-center mb-3 p-2 bg-white border rounded">
            <span class="fw-bold small text-secondary">Mesin AI:</span>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="ai_mode_rapor" id="ai_claude_rapor" value="CLAUDE" checked>
                <label class="form-check-label small fw-bold text-dark" for="ai_claude_rapor">Claude 3.5 Sonnet</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="ai_mode_rapor" id="ai_qwen_rapor" value="QWEN">
                <label class="form-check-label small fw-bold text-dark" for="ai_qwen_rapor">Qwen 2.5-72B</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="ai_mode_rapor" id="ai_gemini_rapor" value="GEMINI">
                <label class="form-check-label small fw-bold text-dark" for="ai_gemini_rapor">Google Gemini</label>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="fw-bold text-primary mb-2">Evaluasi Siswa: <span id="eval_nama_siswa" class="text-dark"></span></label>
            <textarea id="eval_catatan_final" class="form-control border-primary shadow-sm" rows="5" placeholder="Catatan akhir rapor akan muncul di sini..."></textarea>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <button class="btn btn-outline-primary fw-bold shadow-sm" onclick="prosesSintesisAI()" id="btnGenerateAI"><i class="fa-solid fa-wand-magic-sparkles me-2"></i>Generate via AI</button>
            <div id="aiLoading" class="text-primary fw-bold d-none">
              <span class="spinner-border spinner-border-sm me-2" role="status"></span>AI sedang menganalisis data...
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
          <button type="button" class="btn btn-success fw-bold" onclick="simpanCatatanEvaluasi()"><i class="fa-solid fa-floppy-disk me-2"></i>Simpan Catatan Final</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    let failsafeTimer = setTimeout(() => {
      let loader = document.getElementById('loadingOverlay');
      if (loader) loader.style.display = 'none';
    }, 5000);

    let DB = {};
    let currentContext = { kelas: "", periode: "" };
    const LOGO_URL = "https://lh3.googleusercontent.com/d/1tPegGxtj350rixzpnEDmAcbSY-47k49m"; 
    let htmlForNativePrint = ""; 

    try {
      let cUser = JSON.parse(sessionStorage.getItem('eduUser'));
      if (!cUser || !cUser.name) window.top.location.href = SCRIPT_URL + "?page=login";
      else loadData(); 
    } catch(e) {
      document.getElementById('loadingOverlay').style.display = 'none';
      Swal.fire('Error Sesi', 'Sesi tidak valid. Harap login ulang.', 'error');
    }

    function showL(t="Memproses...") { document.getElementById('loadingText').innerText = t; document.getElementById('loadingOverlay').style.display = 'flex'; }
    function hideL() { document.getElementById('loadingOverlay').style.display = 'none'; }

    function loadData() {
      showL("Memuat Referensi Master...");
      google.script.run
        .withSuccessHandler(res => { clearTimeout(failsafeTimer); DB = res || {}; initUI(); hideL(); })
        .withFailureHandler(err => { hideL(); Swal.fire('Error Database', err.message, 'error'); })
        .getMasterReferences();
    }

    function initUI() {
      let optPeriode = '<option value="">- Pilih Periode -</option>';
      let idPeriodeAktif = '';
      (DB.MasterPeriode || []).forEach(p => {
        let sel = ''; if (p.status_aktif === 'AKTIF') { sel = 'selected'; idPeriodeAktif = p.id_periode; }
        optPeriode += `<option value="${p.id_periode}" ${sel}>${p.tahun_ajaran} (Smt ${p.semester})</option>`;
      });
      document.getElementById('p_periode').innerHTML = optPeriode;
      if (idPeriodeAktif) document.getElementById('p_periode').value = idPeriodeAktif;

      let optKelas = '<option value="">- Pilih Kelas -</option>';
      (DB.MasterKelas || []).forEach(k => optKelas += `<option value="${k.id_kelas}">${k.nama_kelas}</option>`);
      document.getElementById('p_kelas').innerHTML = optKelas;
    }

    function updateOptions() {
      let idKls = document.getElementById('p_kelas').value;
      let idPer = document.getElementById('p_periode').value;
      
      document.getElementById('printAreaContainer').classList.add('d-none');
      htmlForNativePrint = ""; 

      if (!idKls || !idPer) {
         document.getElementById('p_siswa').innerHTML = '<option value="">- Pilih Siswa -</option>';
         return;
      }

      if (currentContext.kelas !== idKls || currentContext.periode !== idPer) {
         showL("Menarik Data Rapor Kelas...");
         google.script.run
           .withSuccessHandler(res => {
              DB = res || {}; currentContext = { kelas: idKls, periode: idPer };
              hideL(); populateSiswaDropdown(idKls);
           })
           .withFailureHandler(err => { hideL(); Swal.fire('Error Jaringan', err.message, 'error'); })
           .getTransactionalDataByContext(idKls, idPer, true); 
      } else {
         populateSiswaDropdown(idKls);
      }
    }

    function populateSiswaDropdown(idKls) {
      let optSiswa = '<option value="">- Pilih Siswa -</option>';
      let siswa = (DB.MasterSiswa || []).filter(s => String(s.id_kelas) === String(idKls));
      siswa.forEach(s => optSiswa += `<option value="${s.id_siswa}">${s.nama_siswa}</option>`);
      document.getElementById('p_siswa').innerHTML = optSiswa;
      renderDokumen();
    }

    function toggleBobotPanel() {
      let mode = document.getElementById('p_mode_kalkulasi').value;
      let panel = document.getElementById('panel_bobot_stnkm');
      if (mode === '3') panel.classList.remove('d-none'); else panel.classList.add('d-none');
    }

    function getP5Checkmark(idSiswa, idProyek, idTarget) {
      let cek = { bb:'', mb:'', bsh:'', sb:'' };
      let rekamP5 = (DB.TransNilaiP5 || []).find(p => String(p.id_siswa) === String(idSiswa) && String(p.id_proyek) === String(idProyek) && String(p.id_target) === String(idTarget));
      if (rekamP5) {
        if (rekamP5.predikat === 'BB') cek.bb = 'V'; else if (rekamP5.predikat === 'MB') cek.mb = 'V';
        else if (rekamP5.predikat === 'BSH') cek.bsh = 'V'; else if (rekamP5.predikat === 'SB') cek.sb = 'V';
      }
      return cek;
    }

    function renderDokumen() {
      try {
        let idPer = document.getElementById('p_periode').value;
        let idKls = document.getElementById('p_kelas').value;
        let idSis = document.getElementById('p_siswa').value;
        let modeCetak = document.getElementById('p_mode').value;
        let container = document.getElementById('printAreaContainer');

        if(!idPer || !idKls || !idSis) { container.classList.add('d-none'); htmlForNativePrint = ""; return; }

        let siswa = (DB.MasterSiswa || []).find(s => String(s.id_siswa) === String(idSis)) || {};
        let kelas = (DB.MasterKelas || []).find(k => String(k.id_kelas) === String(idKls)) || {};
        let periode = (DB.MasterPeriode || []).find(p => String(p.id_periode) === String(idPer)) || {};
        let agamaObj = (DB.MasterAgama || []).find(a => String(a.id_agama) === String(siswa.id_agama));
        
        let isSemester2 = (String(periode.semester) === '2' || String(periode.semester).toLowerCase() === 'genap');
        let today = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        let sek = (DB.PengaturanSekolah && DB.PengaturanSekolah.length > 0) ? DB.PengaturanSekolah[0] : { nama_sekolah: '-', alamat_sekolah: '-', kota: 'Nabire', nama_kepsek: '-', nip_kepsek: '-', kkm_global: 75, npsn: '-' };

        let htmlPrint = "";

        const wrapPageSection = (headerHtml, tbodyHtml, footerHtml, isBreak) => `
          <div class="page-section ${isBreak ? 'page-break' : ''}">
            <table class="main-print-table">
              <thead><tr><td style="padding-bottom: 10px;">${headerHtml}</td></tr></thead>
              <tbody><tr><td>${tbodyHtml}</td></tr></tbody>
              <tfoot><tr><td style="padding-top: 15px;">${footerHtml}</td></tr></tfoot>
            </table>
          </div>
        `;

        if (modeCetak === 'lengkap') {
          htmlPrint += `
            <div class="page-section page-break">
              <div style="text-align: center; font-size: 24px; font-weight: bold; margin-top: 30mm; letter-spacing: 2px;">RAPOR PESERTA DIDIK</div>
              <div style="text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 25mm;">SEKOLAH DASAR (SD)<br>${sek.nama_sekolah}</div>
              <img src="${LOGO_URL}" style="display: block; margin: 0 auto 25mm auto; width: 45mm; height: auto;" alt="Logo Sekolah" crossorigin="anonymous">
              <div style="border: 2px solid #000; width: 70%; margin: 0 auto 30mm auto; padding: 10mm; text-align: center;">
                <div style="font-size: 16px; margin-bottom: 10px;">Nama Peserta Didik:</div>
                <div style="font-size: 22px; font-weight: bold; text-transform: uppercase; margin-bottom: 5px;">${siswa.nama_siswa || '-'}</div>
                <div style="font-size: 16px;">NISN/NIS: ${siswa.id_siswa || '-'}</div>
              </div>
              <div style="text-align: center; font-size: 18px; font-weight: bold;">KEMENTERIAN PENDIDIKAN, KEBUDAYAAN,<br>RISET, DAN TEKNOLOGI<br>REPUBLIK INDONESIA</div>
            </div>
            
            <div class="page-section page-break" style="padding-top: 20mm;">
              <div style="text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 10mm;">KETERANGAN TENTANG DIRI PESERTA DIDIK</div>
              <table style="width: 100%; margin: 0 auto; font-size: 14px; line-height: 1.8; border: none;">
                <tr><td width="5%" align="center">1.</td><td width="35%">Nama Peserta Didik (Lengkap)</td><td width="2%" align="center">:</td><td><strong>${siswa.nama_siswa || '-'}</strong></td></tr>
                <tr><td align="center">2.</td><td>Nomor Induk Siswa Nasional (NISN)</td><td align="center">:</td><td>${siswa.id_siswa || '-'}</td></tr>
                <tr><td align="center">3.</td><td>Tempat, Tanggal Lahir</td><td align="center">:</td><td>${siswa.tempat_lahir || '-'}, ${siswa.tgl_lahir || '-'}</td></tr>
                <tr><td align="center">4.</td><td>Jenis Kelamin</td><td align="center">:</td><td>${siswa.jenis_kelamin === 'L' ? 'Laki-Laki' : siswa.jenis_kelamin === 'P' ? 'Perempuan' : '-'}</td></tr>
                <tr><td align="center">5.</td><td>Suku / Agama</td><td align="center">:</td><td>${siswa.suku || '-'}</td></tr>
                <tr><td align="center">6.</td><td>Alamat Peserta Didik</td><td align="center">:</td><td>Sesuai Data Dapodik</td></tr>
                <tr><td align="center">7.</td><td>Diterima di Sekolah Ini</td><td align="center"></td><td></td></tr>
                <tr><td></td><td style="padding-left:15px;">a. Di Kelas</td><td align="center">:</td><td>${kelas.nama_kelas || '-'}</td></tr>
                <tr><td></td><td style="padding-left:15px;">b. Pada Tanggal</td><td align="center">:</td><td>-</td></tr>
              </table>
              <table class="ttd-table" style="margin-top: 30mm;">
                <tr>
                  <td width="60%"></td>
                  <td width="40%" style="text-align: left; padding-left: 20px;">
                    ${sek.kota}, ${today}<br>Kepala Sekolah,<br><br><br><br><br>
                    <strong>${sek.nama_kepsek}</strong><br>NIP. ${sek.nip_kepsek}
                  </td>
                </tr>
              </table>
            </div>
          `;
        }

        if (modeCetak === 'lengkap' || modeCetak === 'akademik') {
          let jurnalSiswa = (DB.TransJurnal || []).filter(j => String(j.id_siswa) === String(idSis));
          let totalBonusJurnal = 0; let catatanKarakter = [];

          jurnalSiswa.forEach(j => {
            if (j.mode_dampak === 'BONUS') totalBonusJurnal += (parseFloat(j.val_S)||0) + (parseFloat(j.val_T)||0) + (parseFloat(j.val_N)||0) + (parseFloat(j.val_K)||0) + (parseFloat(j.val_M)||0);
            else if (j.mode_dampak === 'PISAH' && j.narasi_kejadian) catatanKarakter.push(j.narasi_kejadian);
          });
          
          let cWali = (DB.TransCatatanWali || []).find(cw => String(cw.id_siswa) === String(idSis) && String(cw.id_periode) === String(idPer));
          let teksCatatan = cWali ? cWali.catatan_final : (catatanKarakter.length > 0 ? catatanKarakter.join(" | ") : "Peserta didik menunjukkan perkembangan sikap dan karakter yang stabil.");

          let headerAka = `
            <div style="text-align:center; font-weight:bold; font-size:16px; margin-bottom:15px;">PENCAPAIAN KOMPETENSI PESERTA DIDIK</div>
            <table class="header-info-table">
              <tr><td width="20%">Nama Sekolah</td><td width="2%">:</td><td width="48%"><strong>${sek.nama_sekolah}</strong></td><td width="12%">Kelas</td><td width="2%">:</td><td width="16%">${kelas.nama_kelas || '-'}</td></tr>
              <tr><td>Alamat Sekolah</td><td>:</td><td>${sek.alamat_sekolah}</td><td>Semester</td><td>:</td><td>${periode.semester || '-'}</td></tr>
              <tr><td>Nama Siswa</td><td>:</td><td><strong>${siswa.nama_siswa || '-'}</strong></td><td>Tahun Ajaran</td><td>:</td><td>${periode.tahun_ajaran || '-'}</td></tr>
              <tr><td>NISN / NPSN</td><td>:</td><td>${siswa.id_siswa || '-'} / ${sek.npsn || '-'}</td><td></td><td></td><td></td></tr>
            </table>
          `;

          let tbodyAkaRows = "";
          let mapelSemua = (DB.MasterMapel || []); let noMapel = 1; let modeKalkulasi = document.getElementById('p_mode_kalkulasi').value;
          let agamaSiswa = String(agamaObj ? agamaObj.nama_agama : "").toLowerCase(); 
          let tingkatKelas = 0; let matchKelas = String(kelas.nama_kelas || "").match(/\d+/); 
          if (matchKelas) tingkatKelas = parseInt(matchKelas[0]);

          let mapelTersaring = mapelSemua.filter(mapel => {
            let nm = String(mapel.nama_mapel || "").toLowerCase();
            if (nm.includes("agama")) {
              if (agamaSiswa.includes("kristen") && nm.includes("kristen") && !nm.includes("katolik")) return true;
              if (agamaSiswa.includes("katolik") && nm.includes("katolik")) return true;
              if (agamaSiswa.includes("islam") && nm.includes("islam")) return true;
              if (agamaSiswa.includes("hindu") && nm.includes("hindu")) return true;
              if (agamaSiswa.includes("buddha") && nm.includes("buddha")) return true;
              return false; 
            }
            if ((nm === "ipa" || nm === "ips") && tingkatKelas >= 1 && tingkatKelas <= 3) return false;
            return true; 
          });

          mapelTersaring.forEach(mapel => {
            let nilaiSiswa = (DB.TransNilai || []).filter(n => String(n.id_siswa) === String(idSis) && String(n.id_periode) === String(idPer) && String(n.id_mapel) === String(mapel.id_mapel));
            let nilaiAkhirText = "-"; let deskripsiText = "-";
            
            if(nilaiSiswa.length > 0) {
              let count = nilaiSiswa.length;
              let sumMentah = 0, sumS = 0, sumT = 0, sumN = 0, sumK = 0, sumM = 0;
              
              let keranjangKuat = { S: new Set(), T: new Set(), N: new Set(), K: new Set(), M: new Set() };
              let keranjangSemua = { S: new Set(), T: new Set(), N: new Set(), K: new Set(), M: new Set() };

              nilaiSiswa.forEach(n => {
                let nS = parseFloat(n.poin_S || 0), nT = parseFloat(n.poin_T || 0), nN = parseFloat(n.poin_N || 0), nK = parseFloat(n.poin_K || 0), nM = parseFloat(n.poin_M || 0);
                sumMentah += parseFloat(n.nilai || 0); sumS += nS; sumT += nT; sumN += nN; sumK += nK; sumM += nM;
                
                let nilaiT = parseFloat(n.nilai || 0);
                let isKuat = nilaiT >= 75; 
                
                let namaTopik = "";
                let materiObj = DB.MasterMateri?.find(mt => String(mt.id_materi) === String(n.id_materi));
                if (materiObj && materiObj.nama_materi) {
                  namaTopik = materiObj.nama_materi;
                } else {
                  let mbkObj = DB.MasterMBK?.find(mb => String(mb.id_jenis) === String(n.id_jenis));
                  if (mbkObj) namaTopik = mbkObj.kategori_penilaian;
                }
                
                if (namaTopik) {
                  if (nS > 0) { keranjangSemua.S.add(namaTopik); if (isKuat) keranjangKuat.S.add(namaTopik); }
                  if (nT > 0) { keranjangSemua.T.add(namaTopik); if (isKuat) keranjangKuat.T.add(namaTopik); }
                  if (nN > 0) { keranjangSemua.N.add(namaTopik); if (isKuat) keranjangKuat.N.add(namaTopik); }
                  if (nK > 0) { keranjangSemua.K.add(namaTopik); if (isKuat) keranjangKuat.K.add(namaTopik); }
                  if (nM > 0) { keranjangSemua.M.add(namaTopik); if (isKuat) keranjangKuat.M.add(namaTopik); }
                }
              });

              if (modeKalkulasi === '1' || modeKalkulasi === '2') {
                nilaiAkhirText = Math.round(sumMentah / count);
                if (modeKalkulasi === '2') {
                   let nilaiHibrida = nilaiAkhirText + (totalBonusJurnal / mapelTersaring.length);
                   nilaiAkhirText = Math.round(Math.min(Math.max(nilaiHibrida, 0), 100));
                }
              } else if (modeKalkulasi === '3') {
                let wS = parseFloat(document.getElementById('bobot_S').value || 1); let wT = parseFloat(document.getElementById('bobot_T').value || 1);
                let wN = parseFloat(document.getElementById('bobot_N').value || 1); let wK = parseFloat(document.getElementById('bobot_K').value || 1); let wM = parseFloat(document.getElementById('bobot_M').value || 1);
                let totalWeight = wS + wT + wN + wK + wM; if (totalWeight === 0) totalWeight = 1; 

                let avgS = sumS / count, avgT = sumT / count, avgN = sumN / count, avgK = sumK / count, avgM = sumM / count;
                let nilaiAbsolut = ((avgS * wS) + (avgT * wT) + (avgN * wN) + (avgK * wK) + (avgM * wM)) / totalWeight;
                nilaiAbsolut += (totalBonusJurnal / mapelTersaring.length); 
                if (nilaiAbsolut > 100) nilaiAbsolut = 100; if (nilaiAbsolut < 0) nilaiAbsolut = 0;
                nilaiAkhirText = Math.round(nilaiAbsolut);
              }

              if (modeKalkulasi === '1') {
                if(nilaiAkhirText >= 90) deskripsiText = "Sangat baik dalam memahami materi dan kompetensi dasar.";
                else if(nilaiAkhirText >= 75) deskripsiText = "Baik dalam memahami sebagian besar kompetensi dasar.";
                else deskripsiText = "Membutuhkan bimbingan lebih lanjut untuk menguasai kompetensi dasar.";
              } else {
                let avgS = sumS / count, avgT = sumT / count, avgN = sumN / count, avgK = sumK / count, avgM = sumM / count;
                let arr = [ 
                  { id: 'S', nama: "keterampilan teknis", nilai: avgS }, 
                  { id: 'T', nama: "pemahaman teori", nilai: avgT }, 
                  { id: 'N', nama: "penalaran kritis", nilai: avgN }, 
                  { id: 'K', nama: "sikap kolaboratif", nilai: avgK }, 
                  { id: 'M', nama: "antusiasme belajar", nilai: avgM } 
                ];
                arr.sort((a, b) => b.nilai - a.nilai);
                let tertinggi = arr[0], terendah = arr[4];
                
                if (tertinggi.nilai === 0) {
                   deskripsiText = "Belum ada data kompetensi STNKM yang memadai.";
                } else {
                    const pPositif = ["Menunjukkan keunggulan dalam", "Sangat kompeten pada", "Memiliki penguasaan yang kuat terkait", "Menampilkan pemahaman mendalam tentang", "Berhasil menguasai secara optimal bidang", "Sangat antusias dan cakap dalam", "Sangat terampil dan konsisten dalam", "Mampu mengaplikasikan dengan sangat baik konsep", "Tampak percaya diri dan sigap saat menangani", "Menunjukkan kemajuan yang signifikan pada", "Memiliki daya tangkap dan kreativitas tinggi dalam", "Sangat proaktif dan mandiri dalam menyelesaikan"];
                    const pNegatif = ["namun perlu pendampingan lebih pada", "meski demikian, masih membutuhkan bimbingan dalam", "akan tetapi masih memerlukan arahan intensif mengenai", "dan disarankan untuk lebih fokus melatih", "namun masih perlu meningkatkan konsistensi pada", "serta membutuhkan dorongan ekstra untuk memperdalam", "meskipun perlu terus berlatih secara mandiri dalam", "namun memerlukan perhatian lebih lanjut terkait", "dan diharapkan dapat terus mengasah kemampuan pada", "serta perlu memperluas wawasan dan pemahaman mengenai"];
                   
                   let randPos = pPositif[Math.floor(Math.random() * pPositif.length)];
                   let randNeg = pNegatif[Math.floor(Math.random() * pNegatif.length)];

                   let topTopikArr = Array.from(keranjangKuat[tertinggi.id].size > 0 ? keranjangKuat[tertinggi.id] : keranjangSemua[tertinggi.id]);
                   let botTopikArr = Array.from(keranjangSemua[terendah.id]);

                   const cleanTopik = (str) => str.replace(/\s*\(.*?\)\s*/g, '').trim().toLowerCase();

                   let topTopikStr = topTopikArr.length > 0 ? `, khususnya pada materi <strong>${cleanTopik(topTopikArr[0])}</strong>` : "";
                   let botTopikStr = botTopikArr.length > 0 ? ` terkait <strong>${cleanTopik(botTopikArr[0])}</strong>` : "";

                   deskripsiText = `${randPos} aspek <strong>${tertinggi.nama}</strong>${topTopikStr}, ${randNeg} aspek <strong>${terendah.nama}</strong>${botTopikStr}.`;
                   deskripsiText = deskripsiText.charAt(0).toUpperCase() + deskripsiText.slice(1);
                }
              }
            }
            tbodyAkaRows += `<tr><td style="text-align:center;">${noMapel++}</td><td>${mapel.nama_mapel}</td><td style="text-align:center;">${sek.kkm_global}</td><td style="text-align:center; font-weight:bold;">${nilaiAkhirText}</td><td style="font-size:11px; padding:8px;">${deskripsiText}</td></tr>`;
          });

          let tbodyAka = `
            <table class="nilai-table">
              <thead><tr><th width="5%">No</th><th width="25%">Mata Pelajaran</th><th width="10%">KKM</th><th width="15%">Nilai Akhir</th><th width="45%">Capaian Kompetensi (Deskripsi)</th></tr></thead>
              <tbody>${tbodyAkaRows}</tbody>
            </table>
          `;

          let ttdHtmlAka = `<table class="ttd-table"><tr>`;
          if(isSemester2) {
            ttdHtmlAka += `<td width="33.3%">Mengetahui,<br>Orang Tua/Wali<br><br><br><br><br>__________________</td><td width="33.3%">Mengetahui,<br>Kepala Sekolah<br><br><br><br><br><strong>${sek.nama_kepsek}</strong><br>NIP. ${sek.nip_kepsek}</td><td width="33.3%">${sek.kota}, ${today}<br>Wali Kelas<br><br><br><br><br><strong>${kelas.wali_kelas || '__________________'}</strong><br>NIP. -</td>`;
          } else {
            ttdHtmlAka += `<td width="50%">Mengetahui,<br>Orang Tua/Wali<br><br><br><br><br>__________________</td><td width="50%">${sek.kota}, ${today}<br>Wali Kelas<br><br><br><br><br><strong>${kelas.wali_kelas || '__________________'}</strong><br>NIP. -</td>`;
          }
          ttdHtmlAka += `</tr></table>`;

          let footerAka = `
            <div class="avoid-break" style="border: 1px solid #000; padding: 10px; margin-bottom: 20px;">
              <div style="font-weight:bold; font-size:12px; margin-bottom:5px;">Catatan Wali Kelas:</div>
              <div style="font-size:11px; font-style:italic; text-align: justify;">"${teksCatatan}"</div>
            </div>
            ${ttdHtmlAka}
          `;

          htmlPrint += wrapPageSection(headerAka, tbodyAka, footerAka, (modeCetak === 'lengkap'));
        }

        if (modeCetak === 'lengkap' || modeCetak === 'p5') {
          let proyekKelas = (DB.MasterProyek || []).filter(p => String(p.id_kelas) === String(idKls) && String(p.id_periode) === String(idPer));
          
          if(proyekKelas.length > 0) {
            proyekKelas.forEach((proyek, index) => {
              let targets = (DB.MasterTargetP5 || []).filter(t => String(t.id_proyek) === String(proyek.id_proyek));
              let catatanRec = (DB.TransCatatanP5 || []).find(c => String(c.id_proyek) === String(proyek.id_proyek) && String(c.id_siswa) === String(idSis));
              let catatanTeks = catatanRec ? catatanRec.catatan_proses : '-';

              let headerP5 = `
                <div style="text-align:center; font-weight:bold; font-size:16px; margin-bottom:15px;">RAPOR PROYEK PENGUATAN PROFIL PELAJAR PANCASILA${index > 0 ? ' (Lanjutan)' : ''}</div>
                <table class="header-info-table">
                  <tr><td width="20%">Nama Sekolah</td><td width="2%">:</td><td width="48%"><strong>${sek.nama_sekolah}</strong></td><td width="12%">Kelas</td><td width="2%">:</td><td width="16%">${kelas.nama_kelas || '-'}</td></tr>
                  <tr><td>Alamat Sekolah</td><td>:</td><td>${sek.alamat_sekolah}</td><td>Semester</td><td>:</td><td>${periode.semester || '-'}</td></tr>
                  <tr><td>Nama Siswa</td><td>:</td><td><strong>${siswa.nama_siswa || '-'}</strong></td><td>Tahun Ajaran</td><td>:</td><td>${periode.tahun_ajaran || '-'}</td></tr>
                  <tr><td>NISN / NPSN</td><td>:</td><td>${siswa.id_siswa || '-'} / ${sek.npsn || '-'}</td><td></td><td></td><td></td></tr>
                </table>
                <div style="margin-top: 15px; text-align: left; font-weight: bold; font-size:13px;">PROYEK ${index + 1} | ${proyek.judul_proyek}</div>
                <div style="font-size: 11px; text-align: left; font-weight: normal; margin-bottom: 5px;">${proyek.deskripsi_proyek || ''}</div>
              `;

              let dimensiGroups = {};
              targets.forEach(t => { if(!dimensiGroups[t.dimensi]) dimensiGroups[t.dimensi] = []; dimensiGroups[t.dimensi].push(t); });

              let tbodyP5Rows = "";
              for (const [dimensi, listTarget] of Object.entries(dimensiGroups)) {
                tbodyP5Rows += `<tr><td colspan="5" style="background:#fafafa; font-weight:bold;">${dimensi}</td></tr>`;
                listTarget.forEach(t => {
                  let cek = getP5Checkmark(idSis, proyek.id_proyek, t.id_target);
                  tbodyP5Rows += `
                    <tr>
                      <td><strong>${t.elemen || '-'}</strong><br>${t.sub_elemen || '-'}<br><em style="font-size:10px;">Capaian: ${t.capaian_akhir_fase || '-'}</em></td>
                      <td style="text-align:center; font-weight:bold;">${cek.bb}</td><td style="text-align:center; font-weight:bold;">${cek.mb}</td>
                      <td style="text-align:center; font-weight:bold;">${cek.bsh}</td><td style="text-align:center; font-weight:bold;">${cek.sb}</td>
                    </tr>
                  `;
                });
              }

              let tbodyP5 = `
                <table class="nilai-table">
                  <thead>
                    <tr><th rowspan="2" width="55%">Dimensi, Elemen, dan Sub Elemen</th><th colspan="4" width="45%">Pencapaian</th></tr>
                    <tr><th width="11%">BB</th><th width="11%">MB</th><th width="11%">BSH</th><th width="11%">SB</th></tr>
                  </thead>
                  <tbody>${tbodyP5Rows}</tbody>
                </table>
              `;

              let ttdHtmlP5 = `<table class="ttd-table"><tr>`;
              if(isSemester2) {
                ttdHtmlP5 += `<td width="33.3%">Mengetahui,<br>Orang Tua/Wali<br><br><br><br><br>__________________</td><td width="33.3%">Mengetahui,<br>Kepala Sekolah<br><br><br><br><br><strong>${sek.nama_kepsek}</strong><br>NIP. ${sek.nip_kepsek}</td><td width="33.3%">${sek.kota}, ${today}<br>Wali Kelas<br><br><br><br><br><strong>${kelas.wali_kelas || '__________________'}</strong><br>NIP. -</td>`;
              } else {
                ttdHtmlP5 += `<td width="50%">Mengetahui,<br>Orang Tua/Wali<br><br><br><br><br>__________________</td><td width="50%">${sek.kota}, ${today}<br>Wali Kelas<br><br><br><br><br><strong>${kelas.wali_kelas || '__________________'}</strong><br>NIP. -</td>`;
              }
              ttdHtmlP5 += `</tr></table>`;

              let footerP5 = `
                <div class="avoid-break" style="border: 1px solid #000; padding: 10px; margin-bottom: 20px;">
                  <div style="font-weight: bold; font-size: 12px; margin-bottom: 5px;">Catatan Proses:</div>
                  <div style="font-size: 12px; text-align: justify;">${catatanTeks}</div>
                </div>
                ${ttdHtmlP5}
              `;

              let isBreak = (modeCetak === 'lengkap' || index < proyekKelas.length - 1);
              htmlPrint += wrapPageSection(headerP5, tbodyP5, footerP5, isBreak);
            });
          }
        }

        htmlForNativePrint = htmlPrint;

        let previewHtml = htmlPrint.replace(/page-break/g, ''); 
        container.innerHTML = previewHtml;
        
        let allPages = container.querySelectorAll('.page-section');
        allPages.forEach(p => p.classList.add('preview-page'));

        container.classList.remove('d-none');
        
      } catch (error) {
        console.error("Render Error:", error);
        Swal.fire('Error Render', 'Gagal menyusun data rapor: ' + error.message, 'error');
      }
    }

    function downloadFullPDF() {
      let selectSiswa = document.getElementById('p_siswa');
      let nmSiswa = selectSiswa.options[selectSiswa.selectedIndex]?.text || "Dokumen";
      let modeCetak = document.getElementById('p_mode').value;
      
      if (!htmlForNativePrint) {
        return Swal.fire('Perhatian', 'Pilih periode, kelas, dan siswa terlebih dahulu.', 'warning');
      }

      Swal.fire({ title: 'Merakit PDF', text: 'Membuka jendela cetak sistem...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

      let printWin = window.open('', '', 'width=1024,height=768');
      
      let finalHtml = `
        <html><head>
          <title>Rapor_${modeCetak}_${nmSiswa.replace(/ /g,"_")}</title>
          <style>
            @page { size: portrait; margin: 15mm; }
            body { font-family: 'Times New Roman', Times, serif; color: #000; font-size: 12px; }
            .page-break { page-break-after: always; }
            .main-print-table { width: 100%; border-collapse: collapse; border: none; }
            .main-print-table > thead { display: table-header-group; }
            .main-print-table > tfoot { display: table-footer-group; }
            .main-print-table > tbody > tr > td, 
            .main-print-table > thead > tr > td, 
            .main-print-table > tfoot > tr > td { border: none; padding: 0; }
            .nilai-table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 12px; }
            .nilai-table th, .nilai-table td { border: 1px solid #000; padding: 6px; text-align: left; }
            .nilai-table th { background-color: #f0f0f0; text-align: center; font-weight: bold; }
            .header-info-table { width: 100%; font-size: 13px; margin-bottom: 10px; border-bottom: 2px solid #000; padding-bottom: 5px; border-collapse: collapse; }
            .header-info-table td { border: none; padding: 2px 0; text-align: left; font-weight: normal; }
            .ttd-table { width: 100%; text-align: center; font-size: 13px; font-weight: normal; border: none; }
            .ttd-table td { border: none; padding: 0; }
            tr { page-break-inside: avoid; }
            .avoid-break { page-break-inside: avoid; }
          </style>
        </head><body>
          ${htmlForNativePrint}
        </body></html>
      `;

      printWin.document.write(finalHtml);
      printWin.document.close();
      printWin.focus();

      setTimeout(() => { 
        Swal.close();
        printWin.print(); 
        printWin.close(); 
      }, 800);
    }

    let modalEvaluasi = null;

    function bukaPanelEvaluasi() {
      let idPer = document.getElementById('p_periode').value;
      let idSis = document.getElementById('p_siswa').value;
      let elmSiswa = document.getElementById('p_siswa');
      let nmSiswa = elmSiswa.options[elmSiswa.selectedIndex].text;

      if(!idPer || !idSis) {
        Swal.fire({toast:true, position:'top-end', icon:'warning', title:'Pilih Periode dan Siswa terlebih dahulu!', showConfirmButton:false, timer:3000});
        return;
      }

      document.getElementById('eval_nama_siswa').innerText = nmSiswa;
      
      let catatanEksisting = (DB.TransCatatanWali || []).find(c => String(c.id_siswa) === String(idSis) && String(c.id_periode) === String(idPer));
      document.getElementById('eval_catatan_final').value = catatanEksisting ? catatanEksisting.catatan_final : "";

      if(!modalEvaluasi) modalEvaluasi = new bootstrap.Modal(document.getElementById('modalEvaluasi'));
      modalEvaluasi.show();
    }

    function prosesSintesisAI() {
      let idPer = document.getElementById('p_periode').value;
      let idSis = document.getElementById('p_siswa').value;
      let btn = document.getElementById('btnGenerateAI');
      let loader = document.getElementById('aiLoading');
      let textArea = document.getElementById('eval_catatan_final');
      
      let aiModePilihan = document.querySelector('input[name="ai_mode_rapor"]:checked').value;

      btn.classList.add('d-none');
      loader.classList.remove('d-none');
      textArea.disabled = true;

      google.script.run
        .withSuccessHandler(function(res) {
          btn.classList.remove('d-none'); loader.classList.add('d-none'); textArea.disabled = false;
          if(res.success) {
            textArea.value = res.data;
            Swal.fire({toast:true, position:'top-end', icon:'success', title:'Sintesis AI Selesai!', showConfirmButton:false, timer:2000});
          } else {
            Swal.fire('Gagal', res.message, 'warning');
          }
        })
        .withFailureHandler(function(err) {
          btn.classList.remove('d-none'); loader.classList.add('d-none'); textArea.disabled = false;
          Swal.fire('Error Koneksi', err.message, 'error');
        })
        .generateCatatanAI(idSis, idPer, aiModePilihan); 
    }

    function simpanCatatanEvaluasi() {
      let idPer = document.getElementById('p_periode').value;
      let idKls = document.getElementById('p_kelas').value;
      let idSis = document.getElementById('p_siswa').value;
      let teks = document.getElementById('eval_catatan_final').value.trim();

      if(!teks) {
        Swal.fire('Perhatian', 'Catatan tidak boleh kosong.', 'warning'); return;
      }

      showL("Menyimpan ke Database...");
      
      google.script.run
        .withSuccessHandler(function(res) {
          if(res.success) {
            modalEvaluasi.hide();
            Swal.fire({toast:true, position:'top-end', icon:'success', title:'Tersimpan!', showConfirmButton:false, timer:3000});
            
            google.script.run.withSuccessHandler(function(newDb) {
              DB = newDb || {};
              renderDokumen(); 
              hideL();         
            }).getTransactionalDataByContext(idKls, idPer, true);

          } else {
            hideL(); Swal.fire('Gagal', res.message, 'error');
          }
        })
        .withFailureHandler(function(err) { hideL(); Swal.fire('Error', err.message, 'error'); })
        .saveCatatanWaliFinal({ id_siswa: idSis, id_periode: idPer, catatan_final: teks });
    }
  </script>
